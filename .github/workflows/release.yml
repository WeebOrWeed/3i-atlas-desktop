name: Desktop Release

# Unsigned beta desktop installers. Pushing a v* tag builds macOS and Windows
# artifacts and publishes them to a GitHub Release. Manual runs upload workflow
# artifacts only. No Apple Developer ID or Windows code-signing certificate is
# configured yet; users manually allow the app on first launch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 3I Atlas Desktop ${{ github.ref_name }} (beta)
          body: |
            Unsigned beta desktop build of the 3I Atlas shell.

            - macOS: right-click the app → Open on first launch (Gatekeeper).
            - Windows: More info → Run anyway (SmartScreen).
            - No Apple Developer ID / Windows signing certificate yet.
          prerelease: false
          generate_release_notes: true

  build-mac:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Align package version with release tag
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=process.env.GITHUB_REF_NAME.replace(/^v/,''); fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
      - run: npm install
      - name: Build macOS installers
        run: npm run dist -- --publish never
      - name: List artifacts
        run: ls -la release
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: atlas-desktop-macos
          path: release/*.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.dmg
          prerelease: false

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Align package version with release tag
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=process.env.GITHUB_REF_NAME.replace(/^v/,''); fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
      - run: npm install
      - name: Build Windows installer
        run: npm run dist -- --publish never
      - name: List artifacts
        run: dir release
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: atlas-desktop-windows
          path: release/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.exe
          prerelease: false
